[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phoenix-channels-python-client"
version = "0.2.5"
description = "A Python client library for connecting to Phoenix Channels"
readme = "README.md"
license = "MIT"
authors = [{ name = "Phoenix Channels Python Client" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8",
    "websockets>=14.2",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio>=1.4",
    "pytest-cov",
    "pre-commit>=3.0.0",
    "commitizen>=3.13.0",
    "pyrefly",
    "ruff",
]
test = [
    "pytest",
    "pytest-asyncio>=1.4",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # CLAUDE.md: code speaks for itself; docstrings only where it doesn't.
    "D1",
    # Conflicts with `ruff format`.
    "COM812",
    # CLAUDE.md keeps TYPE_CHECKING for circular imports; Pydantic needs
    # annotations importable at runtime.
    "TC",
    # A message variable before every raise adds nothing to the traceback.
    "EM", "TRY003",
]

[tool.ruff.lint.per-file-ignores]
# pytest asserts; tests reach into internals on purpose.
"tests/**" = ["S101", "SLF001"]
# The supervisor calls its sibling mixins' private methods through a cast of self.
"phoenix_channels_python_client/supervisor.py" = ["SLF001"]

[tool.ruff.lint.flake8-annotations]
# ``**options: Any`` forwards keywords; the callee types them.
allow-star-arg-any = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.coverage.run]
source = ["phoenix_channels_python_client"]
branch = true

[tool.coverage.report]
show_missing = true
# The current total; raise it as coverage grows.
fail_under = 95

# Package discovery for flat layout (phoenix_channels_python_client/ in root)
[tool.setuptools.packages.find]
include = ["phoenix_channels_python_client*"]
exclude = ["tests*"]

[tool.commitizen]
name = "cz_conventional_commits"
