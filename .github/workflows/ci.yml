name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The merge queue re-runs the required checks on each merge group.
  merge_group:

permissions:
  contents: read

jobs:
  test:
    # Drafts get no CI; ready_for_review above fires the first real run.
    if: &not-draft github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Test (Python ${{ matrix.python-version }}${{ matrix.os == 'windows-latest' && ', Windows' || '' }})
    runs-on: ${{ matrix.os }}
    # Backstop for a hung async test; the suite takes well under a minute.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.14"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: ${{ matrix.os == 'windows-latest' }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      # Coverage on one version is enough to report the number.
      - name: Run tests
        run: uv run pytest ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' && '--cov' || '' }}

  lint:
    if: *not-draft
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check with ruff
        run: uv run ruff check

      - name: Check formatting with ruff
        run: uv run ruff format --check

  type-check:
    if: *not-draft
    name: Type Check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run pyrefly
        run: uv run pyrefly check

      - name: Run mypy
        run: uv run mypy phoenix_channels_python_client

  package-typing:
    if: *not-draft
    name: Package Typing (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check installed package types
        env:
          PHOENIX_PACKAGE_TEST: "1"
        run: uv run pytest tests/test_package_typing.py

  minimum-dependencies:
    if: *not-draft
    name: Minimum Dependencies (Python 3.14, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Test minimum runtime dependencies
        run: uv run --frozen --extra dev --with pydantic==2.12.0 --with websockets==14.2 pytest
