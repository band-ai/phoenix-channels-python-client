name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # The merge queue re-runs the required checks on each merge group.
  merge_group:

permissions:
  contents: read

jobs:
  test:
    # Drafts get no CI; ready_for_review above fires the first real run.
    if: &not-draft github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Backstop for a hung async test; the suite takes well under a minute.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      # Coverage on one version is enough to report the number.
      - name: Run tests
        run: uv run pytest ${{ matrix.python-version == '3.13' && '--cov' || '' }}

  windows-heartbeat:
    if: *not-draft
    name: Windows heartbeat (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --extra dev
      - run: uv run pytest tests/test_heartbeat.py tests/test_heartbeat_timeout.py tests/test_supervisor_internals.py tests/test_shutdown_races.py tests/test_reconnect.py

  lint:
    if: *not-draft
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check with ruff
        run: uv run ruff check

      - name: Check formatting with ruff
        run: uv run ruff format --check

  type-check:
    if: *not-draft
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run pyrefly
        run: uv run pyrefly check
